<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Our Groceries" />
  <title>Our Groceries</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #0c0b1d;
      --surface:   #141228;
      --surface2:  #1c1938;
      --border:    rgba(124,93,249,0.18);
      --accent:    #7c5df9;
      --accent2:   #a78bfa;
      --text:      #e8e2ff;
      --text-dim:  #6b5fa0;
      --text-muted:#3d3560;
      --danger:    #f87171;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      background: var(--bg);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── HEADER ──────────────────────────────────────── */
    #header {
      background: linear-gradient(160deg, #3b28cc 0%, #6d28d9 50%, #7c3aed 100%);
      padding: 16px 16px 20px;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      position: sticky; top: 0; z-index: 20;
      box-shadow: 0 4px 32px rgba(109,40,217,0.4);
    }
    .header-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 4px;
    }
    #header h1 {
      font-size: 24px; font-weight: 800; color: #fff; letter-spacing: -0.5px;
    }
    #header h1 span { opacity: 0.75; }
    #header .subtitle {
      font-size: 12px; color: rgba(255,255,255,0.55); font-weight: 500;
    }
    #user-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px; padding: 6px 12px;
      display: flex; align-items: center; gap: 7px;
      cursor: pointer; backdrop-filter: blur(8px);
    }
    #user-avatar {
      width: 22px; height: 22px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; color: var(--bg); flex-shrink: 0;
    }
    #user-name { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.9); }
    #user-caret { font-size: 9px; color: rgba(255,255,255,0.5); }

    /* ── USER DROPDOWN ──────────────────────────────── */
    #user-settings {
      display: none; position: sticky; top: 0; z-index: 15;
      background: #1e1b38; border-bottom: 1px solid var(--border); padding: 14px 16px;
    }
    #user-settings.open { display: block; }
    #user-settings .label {
      font-size: 10px; color: var(--text-dim); font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 10px;
    }
    .user-options { display: flex; gap: 10px; }
    .user-option {
      flex: 1; background: var(--surface2); border: 1.5px solid var(--border);
      border-radius: 14px; padding: 11px;
      display: flex; align-items: center; gap: 10px; cursor: pointer; transition: all 0.15s;
    }
    .user-option .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 900; color: var(--bg); flex-shrink: 0;
    }
    .user-option .uname { color: var(--text); font-size: 14px; font-weight: 700; }
    .user-option .active-label { font-size: 11px; margin-top: 2px; }

    /* ── BANNERS ─────────────────────────────────────── */
    #no-user-banner {
      background: rgba(124,93,249,0.12); border-bottom: 1px solid rgba(124,93,249,0.2);
      padding: 10px 16px; text-align: center; font-size: 13px; color: var(--accent2);
    }
    #error-banner {
      display: none; background: rgba(239,68,68,0.1); border-bottom: 1px solid rgba(239,68,68,0.2);
      padding: 10px 16px; text-align: center; font-size: 13px; color: var(--danger);
    }

    /* ── BOTTOM NAV ──────────────────────────────────── */
    #bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: var(--surface); border-top: 1px solid var(--border);
      display: flex; padding-bottom: env(safe-area-inset-bottom, 0px);
      box-shadow: 0 -8px 32px rgba(0,0,0,0.4);
    }
    .nav-btn {
      flex: 1; background: none; border: none; cursor: pointer;
      padding: 11px 0 9px; display: flex; flex-direction: column;
      align-items: center; gap: 3px; font-family: inherit; transition: all 0.15s;
    }
    .nav-btn .nav-icon { font-size: 19px; line-height: 1; }
    .nav-btn .nav-label { font-size: 10px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.3px; }
    .nav-btn.active .nav-label { color: var(--accent2); }
    .nav-btn.active .nav-icon { filter: drop-shadow(0 0 6px rgba(167,139,250,0.7)); }

    /* ── PAGES ───────────────────────────────────────── */
    .page { display: none; }
    .page.active { display: block; }
    #page-list, #page-settings {
      max-width: 520px; margin: 0 auto; padding: 16px 14px;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
    }

    /* ── STATS BAR ───────────────────────────────────── */
    #stats-bar {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 16px;
      display: flex; justify-content: space-around;
      margin-bottom: 16px;
    }
    .stat { text-align: center; }
    .stat-num { font-size: 22px; font-weight: 800; color: var(--text); }
    .stat-num.accent { color: var(--accent2); }
    .stat-num.green  { color: #4ade80; }
    .stat-label { font-size: 10px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.8px; margin-top: 1px; }

    /* ── ADD BOX ─────────────────────────────────────── */
    #add-box {
      background: var(--surface);
      border: 1px solid rgba(124,93,249,0.2);
      border-radius: 14px; padding: 14px; margin-bottom: 16px;
    }
    /* Dashed add trigger button */
    #add-trigger {
      width: 100%; background: transparent;
      border: 2px dashed rgba(124,93,249,0.35);
      border-radius: 10px; padding: 13px 16px;
      font-size: 14px; font-weight: 600; color: var(--accent2);
      cursor: pointer; font-family: inherit; text-align: center;
      transition: all 0.15s; display: block;
    }
    #add-trigger:hover { border-color: var(--accent); color: #fff; background: rgba(124,93,249,0.08); }
    #add-form { display: none; margin-top: 12px; }
    #add-form.open { display: block; }
    .add-fields { margin-bottom: 10px; }
    #new-item-input {
      width: 100%; background: var(--surface2); border: 1.5px solid rgba(124,93,249,0.2);
      border-radius: 10px; padding: 11px 13px; font-size: 16px;
      color: var(--text); outline: none; font-family: inherit; -webkit-appearance: none;
      transition: border-color 0.2s; resize: none; min-height: 46px; max-height: 160px;
      overflow-y: auto; line-height: 1.5; margin-bottom: 10px;
    }
    #new-item-input::placeholder { color: var(--text-muted); }
    #new-item-input:disabled { opacity: 0.4; }

    /* Category pills in add box */
    #cat-row {
      display: flex; gap: 7px; overflow-x: auto; padding-bottom: 8px;
      scrollbar-width: none; margin-bottom: 10px;
    }
    #cat-row::-webkit-scrollbar { display: none; }
    .cat-pill {
      flex-shrink: 0; background: var(--surface2); border: 1.5px solid var(--border);
      border-radius: 20px; padding: 7px 13px; font-size: 13px; font-weight: 600;
      color: var(--text-dim); cursor: pointer; transition: all 0.15s;
      font-family: inherit; white-space: nowrap;
    }
    .cat-pill.selected { color: #fff; border-color: transparent; }

    .add-bottom { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #add-hint { font-size: 11px; color: var(--text-muted); }
    #add-btn {
      background: var(--surface2); color: var(--text-dim); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 20px; font-size: 14px; font-weight: 700;
      font-family: inherit; flex-shrink: 0; cursor: default; transition: all 0.2s;
    }
    #add-btn.ready { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; box-shadow: 0 4px 16px rgba(124,93,249,0.4); }
    #cancel-add { background: none; border: none; color: var(--text-dim); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; padding: 10px 4px; }

    /* ── FILTER PILLS ────────────────────────────────── */
    #filter-row {
      display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px;
      scrollbar-width: none; margin-bottom: 16px;
    }
    #filter-row::-webkit-scrollbar { display: none; }
    .filter-pill {
      flex-shrink: 0; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 7px 14px; font-size: 13px; font-weight: 600;
      color: var(--text-dim); cursor: pointer; transition: all 0.15s;
      font-family: inherit; white-space: nowrap;
      display: flex; align-items: center; gap: 5px;
    }
    .filter-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 2px 12px rgba(124,93,249,0.35); }
    .filter-pill .pill-count {
      font-size: 11px; font-weight: 700; background: rgba(0,0,0,0.2);
      border-radius: 5px; padding: 1px 6px;
    }
    .filter-pill:not(.active) .pill-count { background: rgba(255,255,255,0.06); color: var(--text-dim); }

    /* ── SECTION HEADERS ─────────────────────────────── */
    .section-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
      padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .section-icon { font-size: 14px; }
    .section-title {
      font-size: 11px; font-weight: 800; color: var(--accent2);
      text-transform: uppercase; letter-spacing: 1.2px;
    }
    .section-count {
      background: rgba(167,139,250,0.15); color: var(--accent2);
      border-radius: 6px; padding: 2px 7px; font-size: 11px; font-weight: 700;
    }
    #toggle-bought-btn {
      margin-left: auto; background: none; border: none; color: var(--text-dim);
      font-size: 12px; cursor: pointer; padding: 2px 6px; font-family: inherit; font-weight: 600;
    }

    #needed-section { margin-bottom: 24px; }
    #divider { border: none; border-top: 1px solid var(--border); margin-bottom: 20px; display: none; }
    #bought-section { display: none; }
    #bought-list-wrap { display: none; }
    #list, #bought-list { display: flex; flex-direction: column; gap: 8px; }

    /* ── ITEM CARD ───────────────────────────────────── */
    .item-card {
      background: var(--surface);
      border: 1px solid rgba(124,93,249,0.2);
      border-radius: 12px; overflow: hidden;
      transition: opacity 0.2s;
    }
    .item-card:not(:last-child) { margin-bottom: 0; }
    #list, #bought-list { gap: 0; border: 1px solid rgba(124,93,249,0.2); border-radius: 14px; overflow: hidden; }
    #list .item-card, #bought-list .item-card {
      border-radius: 0; border: none; border-bottom: 1px solid rgba(124,93,249,0.12);
    }
    #list .item-card:last-child, #bought-list .item-card:last-child { border-bottom: none; }
    .item-card.done { opacity: 0.45; }
    .item-card.pop { animation: popIn 0.3s ease; }

    .card-row {
      padding: 14px 16px; display: flex; align-items: center; gap: 14px;
    }

    /* Checkbox */
    .card-check {
      width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0;
      border: 2px solid rgba(124,93,249,0.4); background: transparent;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s; font-size: 11px;
      font-family: inherit;
    }
    .card-check:hover { border-color: var(--accent); }
    .item-card.done .card-check { border-color: transparent; color: #fff; }

    .card-body { flex: 1; min-width: 0; }
    .card-name { font-weight: 600; font-size: 15px; color: var(--text); word-break: break-word; }
    .card-meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
    .card-cat-badge {
      font-size: 10px; font-weight: 600; padding: 2px 7px;
      border-radius: 20px; opacity: 0.8;
    }
    .card-adder { font-size: 11px; color: var(--text-muted); font-weight: 500; }
    .item-card.done .card-name { color: var(--text-dim); text-decoration: line-through; }

    .card-del {
      background: none; border: none;
      color: var(--text-muted); font-size: 16px; font-weight: 400;
      cursor: pointer; line-height: 1; min-height: 32px; min-width: 32px;
      font-family: inherit; flex-shrink: 0; opacity: 0.5; transition: opacity 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .card-del:hover { opacity: 1; color: var(--danger); }
    .card-undo {
      background: none; border: 1px solid rgba(124,93,249,0.25);
      border-radius: 6px; padding: 4px 10px;
      color: var(--text-dim); font-size: 11px; font-weight: 600;
      cursor: pointer; min-height: 28px; font-family: inherit; flex-shrink: 0;
    }

    /* Bought strip */
    .bought-strip {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px;
    }
    .bought-av {
      width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 8px; font-weight: 900; color: var(--bg);
    }
    .bought-text { font-size: 11px; font-weight: 600; }
    .bought-time { font-size: 11px; color: var(--text-muted); margin-left: 2px; }

    /* ── EMPTY / LOADING ─────────────────────────────── */
    #loading, #empty { text-align: center; padding: 64px 20px; color: var(--text-dim); font-size: 14px; }

    /* ── SYNC DOT ────────────────────────────────────── */
    #sync {
      text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 28px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    #sync-dot {
      width: 6px; height: 6px; border-radius: 50%; background: #4ade80;
      display: inline-block; animation: pulse 2s infinite;
    }

    /* ── SETTINGS PAGE ───────────────────────────────── */
    .settings-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 18px; margin-bottom: 16px;
    }
    .settings-section-title {
      font-size: 10px; font-weight: 800; color: var(--text-dim);
      text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 14px;
    }
    #cat-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .cat-row-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 12px;
    }
    .cat-color-dot {
      width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
      cursor: pointer; border: 2px solid transparent; transition: all 0.15s;
    }
    .cat-name-input {
      flex: 1; background: transparent; border: none; outline: none;
      font-size: 15px; font-weight: 600; color: var(--text); font-family: inherit; min-width: 0;
    }
    .cat-name-input::placeholder { color: var(--text-muted); }
    .cat-del-btn {
      background: none; border: none; color: var(--text-muted); font-size: 17px;
      cursor: pointer; padding: 2px 4px; font-family: inherit; line-height: 1; transition: color 0.15s;
    }
    .cat-del-btn:hover { color: var(--danger); }
    #add-cat-row { display: flex; gap: 8px; align-items: center; }
    #new-cat-input {
      flex: 1; background: var(--surface2); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 10px 12px; font-size: 14px;
      color: var(--text); outline: none; font-family: inherit; -webkit-appearance: none;
      transition: border-color 0.2s;
    }
    #new-cat-input::placeholder { color: var(--text-muted); }
    #add-cat-btn {
      background: var(--accent); color: #fff; border: none; border-radius: 10px;
      padding: 10px 16px; font-size: 14px; font-weight: 700; font-family: inherit;
      cursor: pointer; flex-shrink: 0; transition: all 0.15s;
    }
    #add-cat-btn:disabled { background: var(--surface2); color: var(--text-dim); cursor: default; }
    #color-picker-wrap {
      display: none; flex-wrap: wrap; gap: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; margin-top: 10px;
    }
    #color-picker-wrap.open { display: flex; }
    .color-swatch {
      width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
      border: 2px solid transparent; transition: all 0.15s;
    }
    .color-swatch:hover, .color-swatch.picked { border-color: #fff; transform: scale(1.1); }

    /* ── CATEGORY PICKER (on card) ──────────────────── */
    .card-cat-picker {
      padding: 10px 14px 12px;
      border-top: 1px solid var(--border);
      background: var(--surface2);
      display: none; flex-wrap: wrap; gap: 6px;
    }
    .card-cat-picker.open { display: flex; }
    .card-cat-opt {
      flex-shrink: 0; border-radius: 20px; padding: 5px 11px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      border: 1.5px solid transparent; font-family: inherit;
      transition: all 0.15s;
    }
    .card-cat-opt.current { border-color: rgba(255,255,255,0.4); }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    @keyframes popIn { 0%{transform:translateY(6px) scale(0.97);opacity:0} 100%{transform:translateY(0) scale(1);opacity:1} }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<div id="header">
  <div class="header-top">
    <div>
      <h1>🛒 Our <span>Groceries</span></h1>
      <div class="subtitle">Shared list — synced everywhere</div>
    </div>
    <button id="user-btn" onclick="toggleUserSettings()">
      <div id="user-avatar">?</div>
      <span id="user-name">Who?</span>
      <span id="user-caret">▼</span>
    </button>
  </div>
</div>

<!-- ── USER DROPDOWN ── -->
<div id="user-settings">
  <div class="label">Who's shopping?</div>
  <div class="user-options">
    <button class="user-option" id="opt-angela" onclick="switchUser('angela')">
      <div class="avatar" style="background:#f472b6">A</div>
      <div><div class="uname">Angela</div><div class="active-label" id="active-angela" style="color:#f472b6;display:none">● Active</div></div>
    </button>
    <button class="user-option" id="opt-brad" onclick="switchUser('brad')">
      <div class="avatar" style="background:#818cf8">B</div>
      <div><div class="uname">Brad</div><div class="active-label" id="active-brad" style="color:#818cf8;display:none">● Active</div></div>
    </button>
  </div>
</div>

<!-- ── BANNERS ── -->
<div id="no-user-banner">Tap your name in the top right to get started ↑</div>
<div id="error-banner">⚠️ Couldn't connect — retrying...</div>

<!-- ── LIST PAGE ── -->
<div id="page-list" class="page active">
  <div id="page-list-inner">

    <!-- Stats bar -->
    <div id="stats-bar">
      <div class="stat"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total</div></div>
      <div class="stat"><div class="stat-num green" id="stat-bought">0</div><div class="stat-label">Bought</div></div>
      <div class="stat"><div class="stat-num accent" id="stat-needed">0</div><div class="stat-label">Needed</div></div>
    </div>

    <!-- Add box -->
    <div id="add-box">
      <button id="add-trigger" onclick="openAddForm()">+ Add Item</button>
      <div id="add-form">
        <div class="add-fields">
          <textarea id="new-item-input" rows="1" placeholder="Item name..." disabled
            oninput="onInputChange()" onkeydown="onInputKeyDown(event)"
            onfocus="onInputFocus()" onblur="onInputBlur()"></textarea>
        </div>
        <div id="cat-row"></div>
        <div class="add-bottom">
          <button id="cancel-add" onclick="closeAddForm()">Cancel</button>
          <div style="display:flex;gap:8px;align-items:center">
            <span id="add-hint"></span>
            <button id="add-btn" onclick="addItem()">Add</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Filter pills -->
    <div id="filter-row"></div>

    <div id="loading">Loading...</div>
    <div id="empty" style="display:none">
      <div style="font-size:40px;margin-bottom:12px">🛒</div>
      List is empty — add something above
    </div>

    <!-- Needed -->
    <div id="needed-section" style="display:none">
      <div class="section-header">
        <span class="section-icon">⚡</span>
        <span class="section-title">Needed</span>
        <span class="section-count" id="needed-count">0</span>
      </div>
      <div id="list"></div>
    </div>

    <hr id="divider" />

    <!-- Bought -->
    <div id="bought-section">
      <div class="section-header">
        <span class="section-icon">✅</span>
        <span class="section-title">Bought</span>
        <span class="section-count" id="bought-count">0</span>
        <button id="toggle-bought-btn" onclick="toggleBought()">Show ▼</button>
      </div>
      <div id="bought-list-wrap">
        <div id="bought-list"></div>
      </div>
    </div>

    <div id="sync">
      <span id="sync-dot"></span>
      <span id="sync-label">Live sync</span>
    </div>
  </div>
</div>

<!-- ── SETTINGS PAGE ── -->
<div id="page-settings" class="page">
  <div id="page-settings-inner">
    <div class="settings-section">
      <div class="settings-section-title">Categories</div>
      <div id="cat-list"></div>
      <div id="add-cat-row">
        <input id="new-cat-input" type="text" placeholder="New category name..."

  function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function fmtDate(ts) {
    if (!ts) return '';
    const d = new Date(ts), today = new Date(), yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);
    const t = d.toLocaleTimeString('en-AU', { hour:'numeric', minute:'2-digit', hour12:true });
    if (d.toDateString() === today.toDateString())     return `Today ${t}`;
    if (d.toDateString() === yesterday.toDateString()) return `Yesterday ${t}`;
    return d.toLocaleDateString('en-AU', { day:'numeric', month:'short' }) + ' ' + t;
  }

  function rgbToHex(rgb) {
    const m = rgb.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
    if (!m) return rgb;
    return '#' + [m[1],m[2],m[3]].map(x => (+x).toString(16).padStart(2,'0')).join('');
  }

  // ── Supabase ──────────────────────────────────────────────────
  async function sbFetch(path, options = {}) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      ...options,
      headers: {
        'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json', 'Prefer': 'return=representation',
        ...(options.headers || {}),
      },
    });
    if (!res.ok) throw new Error(await res.text());
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  }

  async function fetchItems() {
    const rows = await sbFetch(`${TABLE}?order=added_at.asc`);
    return (rows || []).map(r => ({
      id: r.id, name: r.name, category: r.category || categories[0]?.id,
      addedBy: r.added_by, addedAt: r.added_at,
      claimedBy: r.claimed_by, claimedAt: r.claimed_at, done: r.done,
    }));
  }

  async function insertItem(item) {
    await sbFetch(TABLE, { method: 'POST', body: JSON.stringify({
      id: item.id, name: item.name, category: item.category,
      added_by: item.addedBy, added_at: item.addedAt,
      claimed_by: item.claimedBy, claimed_at: item.claimedAt, done: item.done,
    })});
  }

  async function updateItem(id, patch) {
    const db = {};
    if ('claimedBy' in patch) db.claimed_by = patch.claimedBy;
    if ('claimedAt' in patch) db.claimed_at = patch.claimedAt;
    if ('done'      in patch) db.done       = patch.done;
    if ('category'  in patch) db.category   = patch.category;
    await sbFetch(`${TABLE}?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify(db) });
  }

  async function deleteItem(id)   { await sbFetch(`${TABLE}?id=eq.${id}`,  { method: 'DELETE' }); }
  async function deleteDoneRows() { await sbFetch(`${TABLE}?done=eq.true`, { method: 'DELETE' }); }

  // ── Category Supabase ─────────────────────────────────────────
  async function fetchCategories() {
    const rows = await sbFetch('categories?order=sort_order.asc');
    if (!rows || rows.length === 0) { await seedDefaultCategories(); return JSON.parse(JSON.stringify(DEFAULT_CATEGORIES)); }
    return rows.map(r => ({ id: r.id, label: r.label, color: r.color }));
  }
  async function seedDefaultCategories() {
    await Promise.all(DEFAULT_CATEGORIES.map((c, i) =>
      sbFetch('categories', { method: 'POST', body: JSON.stringify({ id: c.id, label: c.label, color: c.color, sort_order: i }) }).catch(() => {})
    ));
  }
  async function insertCategory(cat, order) {
    await sbFetch('categories', { method: 'POST', body: JSON.stringify({ id: cat.id, label: cat.label, color: cat.color, sort_order: order }) });
  }
  async function updateCategory(id, patch) {
    await sbFetch(`categories?id=eq.${id}`, { method: 'PATCH', body: JSON.stringify(patch) });
  }
  async function deleteCategoryRow(id) { await sbFetch(`categories?id=eq.${id}`, { method: 'DELETE' }); }

  // ── Category pills (add box) ─────────────────────────────────
  function renderCatRow() {
    const row = document.getElementById('cat-row');

  // ── Filter row ────────────────────────────────────────────────
  function renderFilterRow() {
    const pending = items.filter(i => !i.done);
    const row = document.getElementById('filter-row');
    if (!row) return;
    const tabs = [{ id: 'all', label: 'All', color: '#7c5df9' }, ...categories.map(c => ({ id: c.id, label: c.label, color: c.color }))];

      const count = t.id === 'all' ? pending.length : pending.filter(i => i.category === t.id).length;

      return `<button class="filter-pill${active ? ' active' : ''}"

        onclick="setFilter('${t.id}')">

  function setFilter(id) { activeFilter = id; render(); }

  function updateAddBtn() {
    const input = document.getElementById('new-item-input');
    const btn   = document.getElementById('add-btn');
    const hint  = document.getElementById('add-hint');
    if (!input || !btn) return;
    const lines = input.value.split('\n').map(l => l.trim()).filter(Boolean);
    const ready = lines.length > 0 && currentUser;
    btn.classList.toggle('ready', !!ready);
    btn.textContent = lines.length > 1 ? `Add ${lines.length}` : 'Add';
    if (hint) hint.textContent = lines.length > 1 ? 'One item per line' : (currentUser ? 'New line = new item' : '');
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }

  // ── Bought toggle ─────────────────────────────────────────────
  function toggleBought() {
    boughtVisible = !boughtVisible;
    document.getElementById('bought-list-wrap').style.display = boughtVisible ? 'block' : 'none';
    document.getElementById('toggle-bought-btn').textContent  = boughtVisible ? 'Hide ▲' : 'Show ▼';
  }

  // ── Stats ─────────────────────────────────────────────────────
  function updateStats() {
    const total  = items.length;
    const bought = items.filter(i => i.done).length;
    const needed = total - bought;
    document.getElementById('stat-total').textContent  = total;
    document.getElementById('stat-bought').textContent = bought;
    document.getElementById('stat-needed').textContent = needed;
  }

  // ── Render list ───────────────────────────────────────────────
  function render() {
    const pending = items.filter(i => !i.done);
    const done    = items.filter(i =>  i.done);
    const visible = activeFilter === 'all' ? pending : pending.filter(i => i.category === activeFilter);
    const other   = Object.entries(USERS).find(([k]) => k !== (currentUser || 'angela'));

    document.getElementById('loading').style.display        = 'none';
    document.getElementById('empty').style.display          = items.length === 0 ? 'block' : 'none';
    document.getElementById('needed-section').style.display = visible.length > 0 ? 'block' : 'none';
    document.getElementById('divider').style.display        = (visible.length > 0 && done.length > 0) ? 'block' : 'none';
    document.getElementById('bought-section').style.display = done.length > 0 ? 'block' : 'none';
    document.getElementById('needed-count').textContent     = visible.length;
    document.getElementById('bought-count').textContent     = done.length;
    document.getElementById('list').innerHTML               = visible.map(cardHTML).join('');
    document.getElementById('bought-list').innerHTML        = done.map(cardHTML).join('');
    document.getElementById('sync-label').textContent       = `Synced with ${other[1].name}`;
    renderFilterRow();
    updateStats();
  }

  function cardHTML(item) {
    const adder   = USERS[item.addedBy] || USERS.angela;
    const claimer = item.claimedBy ? USERS[item.claimedBy] : null;
    const isMyItem   = item.addedBy === currentUser;
    const iClaimedIt = item.claimedBy === currentUser;
    const canUndo    = item.done && (iClaimedIt || isMyItem);
    const cat        = getCat(item.category);

    const checkStyle = item.done
      ? `background:${claimer?.color || adder.color};border-color:transparent;`
      : `border-color:${adder.color};`;
    const checkContent = item.done ? '✓' : '';

    const checkBtn = `<button class="card-check" style="${checkStyle}"
      onclick="${item.done ? (canUndo ? `unclaimItem('${item.id}')` : '') : `claimItem('${item.id}')`}"
      ${item.done && !canUndo ? 'disabled style="' + checkStyle + 'cursor:default"' : ''}
    >${checkContent}</button>`;

    const rightBtns = item.done
      ? (canUndo ? `<button class="card-undo" onclick="unclaimItem('${item.id}')">Undo</button>` : '')
      : '';
    const delBtn = (isMyItem || iClaimedIt)
      ? `<button class="card-del" onclick="removeItem('${item.id}')">✕</button>` : '';

    const boughtStrip = item.done && claimer ? `
      <div class="bought-strip" style="background:rgba(124,93,249,0.06);border-top:1px solid rgba(124,93,249,0.12)">
        <div class="bought-av" style="background:${claimer.color}">${claimer.initial}</div>
        <span class="bought-text" style="color:${claimer.color}cc">${claimer.name} bought this</span>
        ${item.claimedAt ? `<span class="bought-time">· ${fmtDate(item.claimedAt)}</span>` : ''}
      </div>` : '';

    const catOpts = categories.map(c => `
      <button class="card-cat-opt${c.id === item.category ? ' current' : ''}"
        style="background:${c.color}22;color:${c.color};${c.id === item.category ? `border-color:${c.color}88;` : ''}"
        onclick="changeCat('${item.id}','${c.id}')">${c.label}</button>`
    ).join('');

    return `
      <div class="item-card ${item.done ? 'done' : ''}" id="card-${item.id}">
        <div class="card-row">
          ${checkBtn}
          <div class="card-body">
            <div class="card-name">${escHtml(item.name)}</div>
            <div class="card-meta">
              <button class="card-cat-badge" style="background:${cat.color}22;color:${cat.color};border:none;cursor:pointer;font-family:inherit"
                onclick="toggleCatPicker('${item.id}')">${cat.label} ✎</button>
              <span class="card-adder">· ${adder.name}</span>
            </div>
          </div>
          ${rightBtns}${delBtn}
        </div>
        <div class="card-cat-picker" id="catpicker-${item.id}">
          ${catOpts}
        </div>
        ${boughtStrip}
      </div>`;
  }

  // ── Settings page ─────────────────────────────────────────────
  function renderSettingsPage() {
    const list = document.getElementById('cat-list');
    list.innerHTML = categories.map(c => `
      <div class="cat-row-item" id="catrow-${c.id}">
        <div class="cat-color-dot" style="background:${c.color}" onclick="openColorPicker('${c.id}')"></div>
        <input class="cat-name-input" value="${escHtml(c.label)}"
          oninput="renameCat('${c.id}', this.value)"
          onblur="saveCatsNow('${c.id}')" />
        <button class="cat-del-btn" onclick="deleteCategory('${c.id}')">✕</button>
      </div>`).join('');
    const cpw = document.getElementById('color-picker-wrap');
    cpw.innerHTML = COLOR_OPTIONS.map(col =>
      `<div class="color-swatch${pendingColor === col ? ' picked' : ''}" style="background:${col}" onclick="pickColor('${col}')"></div>`
    ).join('');
  }

  function openColorPicker(catId) {
    editingColorFor = catId; pendingColor = getCat(catId).color;
    const cpw = document.getElementById('color-picker-wrap');
    cpw.classList.add('open');
    cpw.innerHTML = COLOR_OPTIONS.map(col =>
      `<div class="color-swatch${pendingColor === col ? ' picked' : ''}" style="background:${col}" onclick="pickColor('${col}')"></div>`
    ).join('');
    cpw.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  async function pickColor(col) {
    if (!editingColorFor) return;
    const catId = editingColorFor;
    const cat = categories.find(c => c.id === catId);
    if (cat) cat.color = col;
    const dot = document.querySelector(`#catrow-${catId} .cat-color-dot`);
    if (dot) dot.style.background = col;
    pendingColor = col;
    closeColorPicker();
    renderCatRow(); renderFilterRow();
    try { await updateCategory(catId, { color: col }); } catch (e) { console.error(e); }
  }

  function closeColorPicker() {
    document.getElementById('color-picker-wrap').classList.remove('open');
    editingColorFor = null;
  }

  function renameCat(id, newLabel) {
    const cat = categories.find(c => c.id === id);
    if (cat) cat.label = newLabel;
  }

  async function saveCatsNow(id) {
    const cat = categories.find(c => c.id === id);
    if (!cat) return;
    renderCatRow(); renderFilterRow(); render();
    try { await updateCategory(id, { label: cat.label }); } catch (e) { console.error(e); }
  }

  async function deleteCategory(id) {
    if (categories.length <= 1) { alert('You need at least one category!'); return; }
    categories = categories.filter(c => c.id !== id);
    if (selectedCat === id) selectedCat = categories[0].id;
    if (activeFilter === id) activeFilter = 'all';
    renderSettingsPage(); renderCatRow(); renderFilterRow(); render();
    try { await deleteCategoryRow(id); } catch (e) { console.error(e); }
  }

  function onNewCatInput() {
    document.getElementById('add-cat-btn').disabled = !document.getElementById('new-cat-input').value.trim();
  }

  async function addCategory() {
    const input = document.getElementById('new-cat-input');
    const label = input.value.trim();
    if (!label) return;
    const color = COLOR_OPTIONS[categories.length % COLOR_OPTIONS.length];
    const id = 'cat_' + generateId();
    const order = categories.length;
    categories.push({ id, label, color });
    input.value = '';
    document.getElementById('add-cat-btn').disabled = true;
    renderSettingsPage(); renderCatRow(); renderFilterRow();
    try { await insertCategory({ id, label, color }, order); } catch (e) { console.error(e); }
  }

  // ── Add form open/close ───────────────────────────────────────
  function openAddForm() {
    if (!currentUser) { toggleUserSettings(); return; }
    document.getElementById('add-form').classList.add('open');
    document.getElementById('add-trigger').style.display = 'none';
    setTimeout(() => document.getElementById('new-item-input').focus(), 50);
  }

  function closeAddForm() {
    document.getElementById('add-form').classList.remove('open');
    document.getElementById('add-trigger').style.display = 'block';
    document.getElementById('new-item-input').value = '';
    document.getElementById('new-item-input').style.height = '46px';
    updateAddBtn();
  }

  // ── Input events ──────────────────────────────────────────────
  function onInputChange() { updateAddBtn(); }
  function onInputFocus()  { if (currentUser) document.getElementById('new-item-input').style.borderColor = getCat(selectedCat).color + 'aa'; }
  function onInputBlur()   { document.getElementById('new-item-input').style.borderColor = 'var(--border)'; }
  function onInputKeyDown(e) { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addItem(); } }

  // ── Item actions ──────────────────────────────────────────────
  async function addItem() {
    const input = document.getElementById('new-item-input');
    const names = input.value.split('\n').map(l => l.trim()).filter(Boolean);
    if (!names.length || !currentUser) return;
    const newItems = names.map(name => ({
      id: generateId(), name, category: selectedCat,
      addedBy: currentUser, addedAt: Date.now(),
      claimedBy: null, claimedAt: null, done: false,
    }));
    newItems.forEach(item => items.push(item));
    input.value = ''; input.style.height = '46px';
    closeAddForm(); render();
    newItems.forEach(item => {
      const card = document.getElementById(`card-${item.id}`);
      if (card) { card.classList.add('pop'); setTimeout(() => card.classList.remove('pop'), 400); }
    });
    try { await Promise.all(newItems.map(insertItem)); } catch { await refresh(); }
  }

  async function claimItem(id) {
    const patch = { claimedBy: currentUser, claimedAt: Date.now(), done: true };
    items = items.map(i => i.id === id ? { ...i, ...patch } : i);
    render();
    try { await updateItem(id, patch); } catch { await refresh(); }
  }

  async function unclaimItem(id) {
    const patch = { claimedBy: null, claimedAt: null, done: false };
    items = items.map(i => i.id === id ? { ...i, ...patch } : i);
    render();
    try { await updateItem(id, patch); } catch { await refresh(); }
  }

  async function removeItem(id) {
    items = items.filter(i => i.id !== id);
    render();
    try { await deleteItem(id); } catch { await refresh(); }
  }

  // ── Category change ──────────────────────────────────────────
  function toggleCatPicker(id) {
    const picker = document.getElementById(`catpicker-${id}`);
    if (!picker) return;
    const isOpen = picker.classList.contains('open');
    // close all other pickers first
    document.querySelectorAll('.card-cat-picker.open').forEach(p => p.classList.remove('open'));
    if (!isOpen) picker.classList.add('open');
  }

  async function changeCat(itemId, catId) {
    items = items.map(i => i.id === itemId ? { ...i, category: catId } : i);
    render();
    try {
      await sbFetch(`${TABLE}?id=eq.${itemId}`, {
        method: 'PATCH',
        body: JSON.stringify({ category: catId }),
      });
    } catch (e) {
      console.error('changeCat failed:', e);
      alert('Could not save category change: ' + e.message);
      await refresh();
    }
  }

  // ── Refresh ───────────────────────────────────────────────────
  async function refresh() {
    try {
      items = await fetchItems();
      document.getElementById('error-banner').style.display = 'none';
      document.getElementById('sync-dot').style.background = '#4ade80';
    } catch {
      document.getElementById('error-banner').style.display = 'block';
      document.getElementById('sync-dot').style.background = '#f87171';
    }
    render();
  }

  // ── Push notifications ────────────────────────────────────────
  const VAPID_PUBLIC_KEY = 'BAD-u6SibAVzNWb3eaZfafrCLQ4xSJJQama5xMzEFZ7SLzcqevqCtdU8jMt7hRM3WHLh0YXQBcHloJTW64bm2HU';

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64  = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw     = atob(base64);
    return new Uint8Array([...raw].map(c => c.charCodeAt(0)));
  }

  async function registerPush() {
    if (!currentUser) return;
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      console.log('Push not supported');
      return;
    }

    try {
      const reg = await navigator.serviceWorker.register('/sw.js');
      await navigator.serviceWorker.ready;

      const permission = await Notification.requestPermission();
      if (permission !== 'granted') { console.log('Push permission denied'); return; }

      const existing = await reg.pushManager.getSubscription();
      const sub = existing ?? await reg.pushManager.subscribe({
        userVisibleOnly:      true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });

      // Save subscription to Supabase
      await sbFetch('push_subscriptions', {
        method: 'POST',
        headers: { 'Prefer': 'resolution=merge-duplicates' },
        body: JSON.stringify({
          user_id:      currentUser,
          endpoint:     sub.endpoint,
          subscription: sub.toJSON(),
        }),
      });
      console.log('Push subscription saved for', currentUser);
    } catch (e) {
      console.error('Push registration failed:', e);
    }
  }

  // ── Init ──────────────────────────────────────────────────────
  async function init() {
    updateUserUI();
    try {
      categories = await fetchCategories();
      if (!categories.find(c => c.id === selectedCat)) selectedCat = categories[0]?.id;
    } catch (e) {
      console.error('Could not load categories', e);
      categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
    }
    renderCatRow();
    await refresh();
    // Register push after a short delay so it doesn't block load
    setTimeout(registerPush, 2000);
  }

  init();
  setInterval(refresh, 4000);
</script>
</body>
</html>
